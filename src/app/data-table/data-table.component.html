<div class="container py-4">
    <h2>Employee Data Table</h2>
    
    <!-- Search Bar -->
   
    <input
    type="text"
    class="form-control mb-3"
    placeholder="Search..."
    (input)="searchTable($event)"
  >
    <!-- Table -->
    <table class="table table-bordered">
      <thead>
        <tr>
          <th (click)="sortTable('name')">Name</th>
          <th (click)="sortTable('jobTitle')">Job Title</th>
          <th (click)="sortTable('department')">Department</th>
          <th (click)="sortTable('name')">Name</th>
          <th (click)="sortTable('jobTitle')">Job Title</th>
          <th (click)="sortTable('department')">Department</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let employee of paginateData()">
          <td>{{ employee.name }}</td>
          <td>{{ employee.jobTitle }}</td>
          <td>{{ employee.department }}</td>
          <td>{{ employee.name }}</td>
          <td>{{ employee.jobTitle }}</td>
          <td>{{ employee.department }}</td>
        </tr>
      </tbody>
    </table>
  
    <!-- Pagination -->
    <ul class="pagination">
      <li class="page-item" [class.disabled]="currentPage === 1">
        <a class="page-link" href="#" (click)="changePage(currentPage - 1)">Previous</a>
      </li>
      <li *ngFor="let page of [].constructor(Math.ceil(filteredEmployees.length / rowsPerPage)); let i = index" 
          class="page-item" 
          [class.active]="currentPage === i + 1">
        <a class="page-link" href="#" (click)="changePage(i + 1)">{{ i + 1 }}</a>
      </li>
      <li class="page-item" [class.disabled]="currentPage === Math.ceil(filteredEmployees.length / rowsPerPage)">
        <a class="page-link" href="#" (click)="changePage(currentPage + 1)">Next</a>
      </li>
    </ul>
  </div>
