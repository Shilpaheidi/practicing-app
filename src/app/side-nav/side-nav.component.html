<mat-sidenav-container class="nav-shell">
  <mat-sidenav
    #drawer
    class="nav-sidenav"
    [mode]="isMobile ? 'over' : 'side'"
    [opened]="!isMobile"
    [fixedInViewport]="isMobile"
    [fixedTopGap]="64"
  >
    <div class="brand-header">
      <span class="brand-title">CORONA</span>
    </div>

    <div class="profile-card">
      <div class="profile-avatar">
        <mat-icon>person</mat-icon>
      </div>
      <div class="profile-details">
        <div class="profile-name">
          Henry Keilin
          <mat-icon class="profile-expand">arrow_drop_down</mat-icon>
        </div>
        <div class="profile-role">Gold Member</div>
      </div>
    </div>

    <div class="section-label">Navigation</div>
    <mat-nav-list>
      <a
        mat-list-item
        href="#"
        *ngFor="let item of primaryItems"
        [class.selected]="item.selected"
        (click)="closeSidenavOnMobile()"
      >
        <div class="nav-item-content">
          <span class="nav-icon" [ngClass]="item.colorClass">
            <mat-icon>{{ item.icon }}</mat-icon>
          </span>
          <span class="nav-text">{{ item.label }}</span>
        </div>
      </a>
    </mat-nav-list>

    <div class="section-label mt-4">More</div>
    <mat-nav-list>
      <a
        mat-list-item
        href="#"
        *ngFor="let item of secondaryItems"
        (click)="closeSidenavOnMobile()"
      >
        <div class="nav-item-content">
          <span class="nav-icon" [ngClass]="item.colorClass">
            <mat-icon>{{ item.icon }}</mat-icon>
          </span>
          <span class="nav-text">{{ item.label }}</span>
        </div>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="content-shell">
    <mat-toolbar color="primary" class="top-toolbar">
      <button mat-icon-button (click)="drawer.toggle()" *ngIf="isMobile" aria-label="Open navigation">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="toolbar-title">Dashboard</span>
      <span class="spacer"></span>
      <button mat-icon-button aria-label="Search">
        <mat-icon>search</mat-icon>
      </button>
      <button mat-icon-button aria-label="Notifications">
        <mat-icon>notifications</mat-icon>
      </button>
      <button mat-icon-button aria-label="Profile">
        <mat-icon>account_circle</mat-icon>
      </button>
    </mat-toolbar>

    <div class="page-content">
      <div class="hero-panel">
        <div>
          <h1>Welcome to Corona Dashboard</h1>
          <p>Use the left navigation to explore the dashboard sections with a clean, modern Material layout.</p>
        </div>
      </div>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
